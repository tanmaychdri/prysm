[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prysm"
version = "2.0.0"
description = "A modular, async-first personal AI assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "httpx>=0.27",
    "elevenlabs>=1.0",
    "psutil>=5.9.0",
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
prysm = "prysm.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prysm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
